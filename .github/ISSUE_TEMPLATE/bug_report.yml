name: Bug report
description: Report a defect in Infobroker.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Infobroker issues are tracked on the canonical repository:
        <https://git.gay/flukeatzerocool/Infobroker/issues>.

        The GitHub repository is a read-only mirror, so please file the issue
        there. If you file it here, it may not be actioned.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Infobroker version where you saw the bug.
      placeholder: "e.g. 2026.09.16"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and the MCP client you used.
