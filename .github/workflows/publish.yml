name: Publish

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "bin/**"
      - "tsconfig*.json"
      - "server.json"
  # Manual dispatch lets a maintainer heal a partial publish (e.g. npm
  # succeeded but the MCP Registry step raced and failed) without pushing a
  # no-op commit. The version gates below make a manual run idempotent.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (not floating tags) so a compromised or moved
      # action tag cannot inject code into the publish job. Both majors run on
      # the Node 24 runner runtime; the older v4 pins ran on Node 20 unless
      # forced, and the v4 setup-node rejected `package-manager-cache`, so the
      # cache setting below did nothing but warn.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      # REQ-101: the dependency-vulnerability gate is mandatory on the publish
      # path, not only in the local (bypassable) pre-push hook.
      - name: Gate (typecheck, spec, readme, tests, dependency audit)
        run: npm run check
      - name: Determine if version is already published to npm
        id: check
        run: |
          LOCAL_VERSION=$(node -e "console.log(require('./package.json').version)")
          PUBLISHED_VERSION=$(npm view infobroker version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION"
          echo "published=$PUBLISHED_VERSION"
          echo "local_version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Already published to npm — skipping npm publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      # The npm gate above answers "is npm behind?"; the MCP Registry needs its
      # own gate — "is the registry behind?". Sharing one gate made a partial
      # failure (npm ok / registry failed) unrecoverable on re-run, because the
      # registry step was skipped once npm caught up.
      - name: Determine if version is already in the MCP Registry
        id: mcpcheck
        env:
          SERVER_NAME: io.github.flukeatzerocool/infobroker
        run: |
          ENCODED_NAME=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$SERVER_NAME")
          VERSION="${{ steps.check.outputs.local_version }}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${VERSION}")
          echo "mcp_registry_status=$STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "mcp_should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Already in the MCP Registry — skipping."
          else
            echo "mcp_should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: npm run build
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
      # npm's publish is asynchronous: the CLI returns immediately with "Your
      # package is being processed and may take a few minutes to become
      # available", and the read side then serves the version after a lag with
      # a long tail — observed from ~2 min up to 5m18s (run 43947605837 gave up
      # at 5m00s and npm went green 2s later, failing a release npm had already
      # accepted). The MCP Registry validates server.json against npm, so "npm
      # not serving yet" is a retry condition, not a failure. The wait and the
      # publish therefore share one bounded budget with a long tail instead of
      # a fixed pre-wait that can expire before the publish is even attempted.
      - name: Publish to MCP Registry
        if: steps.mcpcheck.outputs.mcp_should_publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.local_version }}
          # Propagation budget in probes: SHORT_ATTEMPTS at SHORT_DELAY, then
          # the remainder at LONG_DELAY — 60 probes here ≈ 26 minutes. The
          # schedule is data, not prose, so scripts/publish-workflow.test.ts
          # can assert the total never drops below its 15-minute floor; the
          # 5-minute window that failed on 2026-11-16 was under that floor.
          WAIT_ATTEMPTS: 60
          SHORT_ATTEMPTS: 11
          SHORT_DELAY: 10
          LONG_DELAY: 30
        run: |
          wait_for_npm() {
            local attempt delay
            for attempt in $(seq 1 "$WAIT_ATTEMPTS"); do
              if npm view "infobroker@${VERSION}" version >/dev/null 2>&1; then
                echo "npm is serving infobroker@${VERSION} (probe ${attempt})."
                return 0
              fi
              if [ "$attempt" -le "$SHORT_ATTEMPTS" ]; then delay=$SHORT_DELAY; else delay=$LONG_DELAY; fi
              echo "probe ${attempt}/${WAIT_ATTEMPTS}: npm is not serving infobroker@${VERSION} yet; sleeping ${delay}s."
              sleep "$delay"
            done
            echo "::error::npm never served infobroker@${VERSION} within the propagation budget." >&2
            return 1
          }

          wait_for_npm || exit 1

          # mcp-publisher is a pre-built binary; install then publish.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          # Registry-side validation can still lag behind npm's read side, so
          # retry the publish itself on top of the propagation wait.
          for attempt in $(seq 1 5); do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "MCP Registry publish attempt ${attempt} failed; retrying in 15s." >&2
            sleep 15
          done
          echo "::error::MCP Registry publish failed after 5 attempts." >&2
          exit 1
