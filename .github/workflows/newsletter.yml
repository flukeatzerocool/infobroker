name: Newsletter

on:
  schedule:
    - cron: "0 8 * * 3" # Wednesday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate newsletter draft
        run: npm run newsletter
      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain newsletter/drafts/)" ]]; then
            git add newsletter/drafts/
            git commit -m "Add newsletter draft"
            git push
          else
            echo "No new draft to commit."
          fi
