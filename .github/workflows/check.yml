name: Check

# The canonical repository is git.gay; this GitHub mirror is read-only, so a
# pull_request trigger would gate a surface that cannot be merged. Run the
# full gate on pushes to main (after the mirror sync) and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (not floating tags), matching publish.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Gate (typecheck, spec, README, scripts, tests, debate club, audit)
        run: npm run check
