name: Check

# The canonical repository is git.gay; this GitHub mirror is read-only, so a
# pull_request trigger would gate a surface that cannot be merged. Run the
# full gate on pushes to main (after the mirror sync) and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (not floating tags), matching publish.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Gate (typecheck, spec, README, scripts, tests, debate club, audit)
        run: npm run check
